id: us.employment.weekly-claims
path: us/employment/weekly-claims
region: United States
topic: Employment
nav_order: 3
title: Weekly Claims
release: eta.claims
include_releases:
  - eta.claims
# Claims do NOT lead payrolls -- measured, the correlation peaks at a lead of
# nought in every era (see Table 5). What they have is timeliness, and showing
# the monthly series alongside is still the point. UNEMPLOY is the denominator
# of the recipiency rate in Table 7.
include_series:
  - PAYEMS
  - UNRATE
  - UNEMPLOY

# Two revisions live in one line here: a near-constant weekly correction from
# late state reports, and an annual re-estimation of the seasonal factors that
# restates the whole history at once. See FINDINGS_derived_measures.md.
derived:
  - id: ICSA.revision
    kind: level_revision
    of: ICSA
    title: Revision to initial claims, as first published to current
    unit: Persons
    importance: 4
  # Distance off the cycle low rather than the level: the level that matters
  # has drifted down for forty years as covered employment changed shape, so
  # only a relative measure is comparable across eras. See the note on Table 9
  # for what it does and does not signal.
  - id: IC4WSA.above_low
    kind: above_trailing_min
    of: IC4WSA
    window: 52
    title: Initial claims, four-week average, above its trailing 52-week low
    unit: Per cent
    importance: 5
  # Breadth across states. Each state against ITSELF a year earlier, which is
  # what makes it usable on data published unadjusted -- the same week last
  # year carries the same seasonal position.
  - id: STATE.ic_breadth
    kind: share_above_year_ago
    periods: 52
    title: Share of states with initial claims above their year-ago level
    unit: Per cent
    importance: 6
