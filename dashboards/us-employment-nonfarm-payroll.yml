id: us.employment.nonfarm-payroll
path: us/employment/nonfarm-payroll
region: United States
topic: Employment
title: Nonfarm Payroll
# The stamp under the title comes from this release, and only this one.
release: bls.employment_situation
include_releases:
  - bls.employment_situation
# Wage and productivity context from other releases. Each carries its own
# release date, so the page must not present these under the payroll stamp.
include_series:
  - ECIALLCIV
  - ECIWAG
  - FRBATLWGT3MMAUMHWGO
  - OPHNFB
  - ULCNFB

# The as-first-reported change must be computed server-side from the vintage
# matrix; it cannot be derived from first_print levels on the page.
first_reported_change:
  - PAYEMS

# Derived measures. Computed in macro/derived.py and shipped as ordinary series
# so the page renders them with the existing panel types; see
# FINDINGS_derived_measures.md for why each one earns its place. Every entry
# carries derived: true and a formula string, and the page must label them.
derived:
  - id: PAYEMS.revision
    kind: revision
    of: PAYEMS
    title: Revision to the monthly payroll change, first reported to latest
    unit: Thousands of Persons
    importance: 5
  - id: PAYEMS.revision_mean
    kind: revision_mean
    of: PAYEMS
    window: 12
    title: Mean revision to the monthly payroll change, trailing 12 months
    unit: Thousands of Persons
    importance: 4
  - id: PAYEMS.abs_revision_mean
    kind: abs_revision_mean
    of: PAYEMS
    window: 12
    title: Mean absolute revision, trailing 12 months
    unit: Thousands of Persons
    importance: 3
  # The release states a 90% interval of +/-122,000 on the monthly change.
  - id: PAYEMS.signif_share
    kind: signif_share
    of: PAYEMS
    window: 24
    threshold: 122
    title: Share of the trailing 24 months distinguishable from zero at 90%
    unit: Percent
    importance: 4
  # Accounting identities, not models. Breakeven is the labour force's own
  # growth net of the share that stays unemployed; January is dropped because
  # its change is a population-control level break (CLAUDE.md trap 14).
  - id: LF.breakeven
    kind: breakeven
    of: [CLF16OV, UNRATE]
    window: 6
    title: Employment growth that would hold the unemployment rate flat
    unit: Thousands of Persons
    importance: 5
  # EPOP = participation x (1 - u), so its move separates exactly.
  - id: EMRATIO.participation_effect
    kind: epop_participation_effect
    of: [CIVPART, UNRATE]
    periods: 12
    title: Employment-population change from participation, over 12 months
    unit: Percentage points
    importance: 4
  - id: EMRATIO.unemployment_effect
    kind: epop_unemployment_effect
    of: [CIVPART, UNRATE]
    periods: 12
    title: Employment-population change from unemployment, over 12 months
    unit: Percentage points
    importance: 4
  # The same identity on a longer window. Both are drawn: the estimate is
  # sensitive to the window and the reader should see that, not a choice made
  # here. min_obs 8 because October 2025 costs two months and January one.
  - id: LF.breakeven12
    kind: breakeven
    of: [CLF16OV, UNRATE]
    window: 12
    min_obs: 8
    title: Employment growth that would hold the unemployment rate flat, 12-month
    unit: Thousands of Persons
    importance: 4
