id: us.employment.jolts
path: us/employment/jolts
region: United States
topic: Employment
nav_order: 2
title: JOLTS
index_title: 'Job Openings & Labor Turnover'
# Shown on the landing index, which is generated from these specs.
agency: BLS · JOLTS
blurb: >-
  Openings, hires, quits and layoffs, vacancies per jobseeker, and the flow identity checked against the payroll count.
release: bls.jolts
include_releases:
  - bls.jolts
# The Beveridge curve and the vacancy-to-unemployment ratio both need the
# household unemployment rate, which belongs to a different release.
include_series:
  - UNRATE
  # the vacancy-to-unemployment ratio needs the LEVEL, not the rate
  - UNEMPLOY
  # the flow identity checks JOLTS against the establishment survey's own count
  - PAYEMS

# Hires less total separations: what JOLTS says the month's net change was.
# Monthly it is far too noisy to read (sd of the gap against CES is 936k), so
# the panel smooths both sides to twelve months.
derived:
  - id: JOLTS.netflow
    kind: residual
    of: [JTSHIL, JTSTSL]
    title: Net employment change implied by JOLTS, hires less total separations
    unit: Thousands of Persons
    importance: 5
