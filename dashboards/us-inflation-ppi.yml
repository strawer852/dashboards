id: us.inflation.ppi
path: us/inflation/ppi
region: United States
topic: Inflation
nav_order: 2
title: PPI
index_title: 'Producer Prices'
# Shown on the landing index, which is generated from these specs.
agency: BLS · Producer Price Index
blurb: >-
  The whole Final Demand–Intermediate Demand system, stage by stage, with the producer prices that feed PCE.
# The stamp under the title comes from this release, and only this one.
release: bls.ppi
include_releases:
  - bls.ppi

# WPS3012 (Truck Transportation of Freight) is in the catalogue because the
# release sweep above pulls everything tagged bls.ppi, but FRED stopped
# publishing it in December 2011. It exported cleanly and reported full
# coverage for weeks while drawing an empty chart, which is exactly the
# failure neither validation nor coverage can see. WPS301, Transportation of
# Freight and Mail, is the live seasonally adjusted parent and replaces it.
exclude_series:
  - WPS3012

# Contributions ARE possible here, and the derived block at the bottom builds
# them. An earlier version of this comment said the opposite -- that the PPI
# news release carried no relative-importance column the way CPI Table 1 does.
# That was wrong, and wrong carelessly: it was read off PPI Table 2, which is
# percent changes, and generalised. Table 1 has the column, dated Dec. 2025.
#
# What genuinely has no weights is intermediate demand: every stage and
# commodity-type index is published at a relative importance of 100.000,
# because each is its own aggregation base rather than a share of anything.
# The chain therefore cannot be stacked, and Tables 7 to 10 are rates.
#
# No revision panels either, for now: the FD-ID series entered the catalog on
# 4 September 2026 with current-vintage history only. The ALFRED backfill has
# not run for them -- see CLAUDE.md trap 15 and the CPI precedent.
#
# On the naming: the older stage-of-processing chain (crude materials ->
# intermediate materials -> finished goods, PPICRM/PPIITM/PPIFGS) is the one
# people reach for first, and every one of those series is DISCONTINUED on
# FRED. The live framework is Final Demand-Intermediate Demand, launched 2014,
# whose production-flow system runs Stage 1 -> 2 -> 3 -> 4 -> final demand and
# is built for exactly the question this dashboard asks. That is why the data
# starts in November 2009 rather than the 1940s.

# ---- revisions, added 4 September 2026 once the ALFRED backfill landed.
# PPI revises for a third distinct reason, different again from payrolls and
# from the CPI. It is substantial and routine: 120 of the 139 months since 2015
# moved, by a median of 0.13 index points and up to 0.78. The timing is bimodal
# -- of the months that moved, 50 first changed one month after first print and
# 52 at four months, which is the single scheduled revision BLS documents --
# but the magnitudes of the two groups are alike (median 0.15 against 0.10), so
# the split is in when, not how much.
derived:
  # Counted, not weighted. Table 1 is the only PPI table publishing relative
  # importances, and its finest split of final demand leaves a single 34 per cent item
  # -- "finished consumer services less trade, transportation and warehousing"
  # is a leaf with no breakdown at all. A weighted median over that is mostly
  # one series, so this counts components instead, which is how the payroll
  # diffusion indexes work and is a real measure rather than a fallback.
  - id: PPI.fd_breadth
    kind: share_above
    periods: 12
    threshold: 3.0
    title: Share of final demand components rising faster than 3 per cent
    unit: Per cent
    importance: 6
    of:
      - WPSFD41113
      - WPSFD41112
      - WPSFD4112
      - WPSFD4113
      - WPSFD4121
      - WPSFD4122
      - WPSFD4123
      - WPSFD413111
      - WPSFD413112
      - WPSFD413121
      - WPSFD413122
      - WPSFD41321
      - WPSFD41322
      - WPSFD4133
      - WPSFD42311
      - WPSFD42312
      - WPSFD42321
      - WPSFD42322
      - WPSFD4233
      - WPSFD42211
      - WPSFD42212
      - WPSFD42213
      - WPSFD422211
      - WPSFD422212
      - WPSFD42222
      - WPSFD42223
      - WPSFD42111
      - WPSFD42112
      - WPSFD42121
      - WPSFD42122
      - WPSFD4213
      - WPSFD431
      - WPSFD432
  - id: PPI.rev_fd
    kind: level_revision
    of: PPIFIS
    title: Revision to final demand, first published to latest
    unit: Index points
    importance: 4
  - id: PPI.rev_s1
    kind: level_revision
    of: WPSID51
    title: Revision to stage 1, first published to latest
    unit: Index points
    importance: 4

  # ---- the five-way partition of final demand, added 4 September 2026.
  # Weights are the published relative importance from PPI news release
  # Table 1, dated Dec. 2025 -- hence weight_date: 2025-12 throughout, a
  # different anchor month from the CPI dashboard's. They sum to 100.000
  # exactly, and the published core figure (69.732, less foods, energy and
  # trade services) is reproduced by 100 - 5.452 - 5.061 - 19.755, which is
  # the check that says these are the real weights and not a transcription.
  #
  # Intermediate demand gets none of this: every stage and commodity-type
  # index is published with a relative importance of 100.000, because each
  # is its own aggregation base rather than a share of final demand. There
  # is no honest way to stack the chain, which is why Tables 4 to 7 are
  # rates.
  - id: PPI.c_services
    kind: contribution
    of: [PPIDSS, PPIFIS]
    weight: 68.338
    weight_date: "2025-12"
    periods: 12
    title: Contribution of final demand services to final demand, over 12 months
    unit: Percentage points
    importance: 4
  - id: PPI.m_services
    kind: contribution
    of: [PPIDSS, PPIFIS]
    weight: 68.338
    weight_date: "2025-12"
    periods: 1
    title: Contribution of final demand services to final demand, over 1 month
    unit: Percentage points
    importance: 4
  - id: PPI.c_coregoods
    kind: contribution
    of: [WPSFD413, PPIFIS]
    weight: 18.515
    weight_date: "2025-12"
    periods: 12
    title: Contribution of final demand goods less foods and energy to final demand, over 12 months
    unit: Percentage points
    importance: 4
  - id: PPI.m_coregoods
    kind: contribution
    of: [WPSFD413, PPIFIS]
    weight: 18.515
    weight_date: "2025-12"
    periods: 1
    title: Contribution of final demand goods less foods and energy to final demand, over 1 month
    unit: Percentage points
    importance: 4
  - id: PPI.c_foods
    kind: contribution
    of: [PPIDFS, PPIFIS]
    weight: 5.452
    weight_date: "2025-12"
    periods: 12
    title: Contribution of final demand foods to final demand, over 12 months
    unit: Percentage points
    importance: 4
  - id: PPI.m_foods
    kind: contribution
    of: [PPIDFS, PPIFIS]
    weight: 5.452
    weight_date: "2025-12"
    periods: 1
    title: Contribution of final demand foods to final demand, over 1 month
    unit: Percentage points
    importance: 4
  - id: PPI.c_energy
    kind: contribution
    of: [PPIDES, PPIFIS]
    weight: 5.061
    weight_date: "2025-12"
    periods: 12
    title: Contribution of final demand energy to final demand, over 12 months
    unit: Percentage points
    importance: 4
  - id: PPI.m_energy
    kind: contribution
    of: [PPIDES, PPIFIS]
    weight: 5.061
    weight_date: "2025-12"
    periods: 1
    title: Contribution of final demand energy to final demand, over 1 month
    unit: Percentage points
    importance: 4
  - id: PPI.c_construction
    kind: contribution
    of: [PPIDCS, PPIFIS]
    weight: 2.634
    weight_date: "2025-12"
    periods: 12
    title: Contribution of final demand construction to final demand, over 12 months
    unit: Percentage points
    importance: 4
  - id: PPI.m_construction
    kind: contribution
    of: [PPIDCS, PPIFIS]
    weight: 2.634
    weight_date: "2025-12"
    periods: 1
    title: Contribution of final demand construction to final demand, over 1 month
    unit: Percentage points
    importance: 4

  # And what each is worth, on the same anchor and the same drift rule.
  - id: PPI.w_services
    kind: relative_importance
    of: [PPIDSS, PPIFIS]
    weight: 68.338
    weight_date: "2025-12"
    title: Share of final demand taken by final demand services
    unit: Percent of the basket
    importance: 3
  - id: PPI.w_coregoods
    kind: relative_importance
    of: [WPSFD413, PPIFIS]
    weight: 18.515
    weight_date: "2025-12"
    title: Share of final demand taken by final demand goods less foods and energy
    unit: Percent of the basket
    importance: 3
  - id: PPI.w_foods
    kind: relative_importance
    of: [PPIDFS, PPIFIS]
    weight: 5.452
    weight_date: "2025-12"
    title: Share of final demand taken by final demand foods
    unit: Percent of the basket
    importance: 3
  - id: PPI.w_energy
    kind: relative_importance
    of: [PPIDES, PPIFIS]
    weight: 5.061
    weight_date: "2025-12"
    title: Share of final demand taken by final demand energy
    unit: Percent of the basket
    importance: 3
  - id: PPI.w_construction
    kind: relative_importance
    of: [PPIDCS, PPIFIS]
    weight: 2.634
    weight_date: "2025-12"
    title: Share of final demand taken by final demand construction
    unit: Percent of the basket
    importance: 3

# Drawn only in a 48-month heatmap of a twelve-month change and
# through the breadth measure over 120 months; 180 covers both with
# head room. export.py checks it against the page and refuses too small.
