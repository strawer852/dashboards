    of: [PPIDSS, PPIFIS]
    weight: 68.338
    weight_date: "2025-12"
    periods: 1
    title: Contribution of final demand services to final demand, over 1 month
    unit: Percentage points
    importance: 4
  - id: PPI.c_coregoods
    kind: contribution
    of: [WPSFD413, PPIFIS]
    weight: 18.515
    weight_date: "2025-12"
    periods: 12
    title: Contribution of final demand goods less foods and energy to final demand, over 12 months
    unit: Percentage points
    importance: 4
