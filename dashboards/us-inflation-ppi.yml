title: PPI
index_title: 'Producer Prices'
# Shown on the landing index, which is generated from these specs.
agency: BLS · Producer Price Index
blurb: >-
  The whole Final Demand–Intermediate Demand system, stage by stage, with the producer prices that feed PCE.
# The one figure the landing page's card shows for this dashboard: the first
# of the page's own summary figures, resolved from the bundle at load.
headline: { label: Final demand, series: PPIFIS, transform: yoy, format: pct }
# The stamp under the title comes from this release, and only this one.
release: bls.ppi
include_releases:
  - bls.ppi

# WPS3012 (Truck Transportation of Freight) is in the catalogue because the
# release sweep above pulls everything tagged bls.ppi, but it ends in
# December 2016: BLS stopped seasonally adjusting truck freight, and the BLS API
# holds no WPS3012 data since (checked 13 September 2026; an earlier version of
# this comment blamed FRED). The release prints WPU3012's change, which Tables
# 26 and 36 draw. It exported cleanly and reported full
# coverage for weeks while drawing an empty chart, which is exactly the
# failure neither validation nor coverage can see. WPS301, Transportation of
# Freight and Mail, is the live seasonally adjusted parent and replaces it.
exclude_series:
  - WPS3012

# ---- Analysis-only series for Tables 21-38, added 13 September 2026: Table 1's
