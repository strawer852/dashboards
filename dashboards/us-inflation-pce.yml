id: us.inflation.pce
path: us/inflation/pce
region: United States
topic: Inflation
nav_order: 3
title: PCE
# The stamp under the title comes from this release, and only this one.
release: bea.personal_income
include_releases:
  - bea.personal_income

# CPI alongside, because the wedge between the two is the whole of Table 3 and
# is the first thing a reader arriving from the CPI page will want. Each
# carries its own release date, so neither may be presented under the PCE
# stamp.
include_series:
  - CPIAUCSL
  - CPILFESL

# Distributional measures over a 210-item partition of the basket, from BEA's
# underlying detail rather than FRED, which carries 25 of these lines. The
# hierarchy is taken from BEA's published workbook, where the label column is
# indented two spaces per level -- recovering it from the numbers does not
# work, because "Beef and veal 68" followed by "Pork 51" is indistinguishable
# from a parent and its child. Reconciliation is then the check: the weights
# sum to 99.658 of 100, the shortfall being two lines the expenditure table
# carries and the price table does not.
#
# These inputs are BEA-sourced and so carry NO revision history (trap 15),
# while the headline series above them are FRED-sourced and carry ten vintages
# per observation. The median cannot show its own revisions; the headline can.
