# The forecast record beside the page (site/us/inflation/cpi/forecasts.json)
# scores each call against the change AS FIRST PRINTED, read from the
# vintages by the exporter. The unadjusted index never revises (trap 25),
# so for CPIAUCNS this equals the current value; the adjusted ones move each
# January when the seasonal factors are re-estimated, which is exactly why
# the score must read the print and not the latest vintage.
first_reported_pct:
  - CPIAUCSL
  - CPILFESL
first_reported_yoy:
  - CPIAUCNS
  - CPILFESL

# No first_reported_change and no revision overlay anywhere on this dashboard.
# The CPI series entered the catalog on 4 September 2026 with current-vintage
# history only; the ALFRED backfill has not run yet, so the vintage matrix that
# a first-print line reads does not exist. CPIAUCSL alone carries 668 vintages
# back to 1972 and they are worth having -- but a revision panel drawn before
# they land would be empty or, worse, wrong. CLAUDE.md trap 15 in spirit: a
# series that structurally cannot show revisions must not be offered them.

# ---------------------------------------------------------------- weights ---
# Every `contribution` entry below is anchored on a published relative
# importance from BLS CPI news release Table 1, reference month July 2026,
# last modified 12 August 2026, whose Relative-importance column is dated
# **Jun. 2026** -- hence weight_date: 2026-06 throughout. The anchor is not a
# frozen constant: derived.contribution re-drifts it every month with relative
# prices, which is BLS's own updating rule, so the weight follows the data
# rather than needing to be retyped. What it cannot follow is the annual
# reweight each January; the decomposition residual is what catches that, and
# validate.py asserts it.
#
# Measured on the current vintage, the four-way analytic split closes on
# headline CPI to 0.017pp at July 2026 and 0.042pp worst over the trailing
# fifteen months.
derived:
  # Distributional measures over a 135-item PARTITION of the basket, built by
  # descending Table 2 only where the children reconcile to their parent; the
  # weights sum to 98.52 of 100 (counted, 9 September 2026 -- an earlier
  # comment here said 137 and 99.81), and 10 of them are exact residuals where BLS
  # publishes no relative importance for a single child. Every input is the
  # unadjusted index, so a twelve-month change needs no seasonal adjustment.
  #
  # Every input is a row of Table 2 (verified by value against the July 2026
  # release with tools/reconcile.py, 9 September 2026) except SEMC04,
  # services by other medical professionals, which is the residual of
  # professional services less physicians, dental and eyeglasses and is
  # priced irregularly. Two inputs used to be sparse children of monthly
  # Table 2 rows -- intracity mass transit (SS53031, last priced April
  # 2026) and food at elementary and secondary schools (SSFV031A, some
  # months missing) -- and, truncated to their last 180 observations, they
  # ended one to three months before the rest. That is what made the
  # by-date alignment (trap 60) change the median in 30 months and the
  # breadth in 164 when it landed. They are now the Table 2 parents, which
  # carry the same weights.
  #
  # These answer what headline, core and every contribution panel cannot: all
  # of those are weighted MEANS, and a mean is what a few violent items carry.
  - id: CPI.median
    kind: weighted_median
    periods: 12
    title: Median item, twelve-month change, weighted by expenditure share
    unit: Per cent
    importance: 7
    of:
