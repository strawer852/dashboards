# Static file server for the dashboards. Auth and TLS are handled by Caddy and
# Authelia in front; this only serves files.

server {
    listen 80;
    server_name _;

    root /srv/dashboards/current;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # The JSON bundles. Written by the exporter, updated whenever a release
    # lands, so they must NOT fall into the immutable block below — an
    # immutable bundle is a dashboard frozen at whatever month it first loaded,
    # and nothing about the page would look wrong.
    location /data/ {
        alias /srv/dashboards/data/;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        types { application/json json; }
        default_type application/json;
        autoindex off;
    }

    # `immutable` is only safe when the VERSION IS IN THE FILENAME. Vendored
    # libraries qualify: echarts-5.6.0.min.js can never change meaning.
    location ~* ^/assets/[a-z]+-[0-9]+\.[0-9]+\.[0-9]+(\.min)?\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Our own assets keep stable names, so they must revalidate. Serving
    # brb-dash.js as immutable pinned browsers to whichever build they first
    # loaded: a page asking for a panel type added later silently rendered
    # nothing, with the correct file sitting on the server the whole time.
    # A revalidation is one cheap 304; a year-stale engine is invisible.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Genuinely static media.
    location ~* \.(woff2|jpg|jpeg|png|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
}
